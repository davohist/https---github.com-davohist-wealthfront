<!DOCTYPE html>
<html lang="ru" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full flex flex-col md:flex-row font-sans text-gray-900 antialiased">

    <header class="flex items-center justify-between bg-slate-900 px-4 py-3 text-white md:hidden">
        <div class="font-bold text-xl tracking-wider text-indigo-400">LOGO</div>
        <button id="menu-btn" class="p-2 rounded-lg hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
        </button>
    </header>

    <aside id="sidebar" class="hidden fixed inset-y-0 left-0 z-50 w-64 flex-col bg-slate-900 p-5 text-gray-300 md:sticky md:flex md:h-screen md:shrink-0 transition-all duration-300 ease-in-out">
        
        <div class="flex items-center justify-between mb-8">
            <div class="font-bold text-2xl tracking-wider text-white">
                Davo<span class="text-indigo-400">Mgt</span>
            </div>
            <button id="close-btn" class="p-1 rounded-lg hover:bg-slate-800 md:hidden">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <nav class="space-y-1 flex-1">
            <a href="#" class="flex items-center px-4 py-3 text-white bg-indigo-600 rounded-lg font-medium transition-colors">
                <span class="mr-3">📊</span> Главная
            </a>
            <a href="#" class="flex items-center px-4 py-3 rounded-lg hover:bg-slate-800 hover:text-white font-medium transition-colors">
                <span class="mr-3">💼</span> Операции
            </a>
            <a href="#" class="flex items-center px-4 py-3 rounded-lg hover:bg-slate-800 hover:text-white font-medium transition-colors">
                <span class="mr-3">📈</span> Аналитика
            </a>
            <a href="#" class="flex items-center px-4 py-3 rounded-lg hover:bg-slate-800 hover:text-white font-medium transition-colors">
                <span class="mr-3">⚙️</span> Настройки
            </a>
        </nav>

        <div class="border-t border-slate-800 pt-4 flex items-center">
            <div class="h-9 w-9 rounded-full bg-indigo-500 flex items-center justify-center font-bold text-white shadow-sm">
                AD
            </div>
            <div class="ml-3 overflow-hidden">
                <p class="text-sm font-medium text-white truncate">Admin User</p>
                <p class="text-xs text-slate-400 truncate">admin@davomgt.com</p>
            </div>
        </div>
    </aside>

    <div id="sidebar-overlay" class="hidden fixed inset-0 z-40 bg-slate-900/40 backdrop-blur-sm md:hidden"></div>

    <main class="flex-1 p-6 md:p-10 overflow-y-auto">
        <div class="max-w-7xl mx-auto">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between pb-6 border-b border-gray-200 mb-8 gap-4">
                <div>
                    <h1 class="text-3xl font-bold tracking-tight text-gray-900">Финансовые операции</h1>
                    <p class="mt-1 text-sm text-gray-500">Мониторинг текущей активности и управление транзакциями.</p>
                </div>
                <div>
                    <button class="w-full md:w-auto inline-flex justify-center items-center px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg text-sm shadow-sm transition-colors">
                        + Новая транзакция
                    </button>
                </div>
            </div>

            <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
                <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
                    <p class="text-sm font-medium text-gray-500">Объем торгов (USD)</p>
                    <p class="mt-2 text-3xl font-semibold tracking-tight text-gray-900">$1,245,800</p>
                </div>
                <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
                    <p class="text-sm font-medium text-gray-500">Успешные сделки</p>
                    <p class="mt-2 text-3xl font-semibold tracking-tight text-green-600">98.4%</p>
                </div>
                <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm sm:col-span-2 lg:col-span-1">
                    <p class="text-sm font-medium text-gray-500">Активные сессии</p>
                    <p class="mt-2 text-3xl font-semibold tracking-tight text-gray-900">42</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        const menuBtn = document.getElementById('menu-btn');
        const closeBtn = document.getElementById('close-btn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');

        function toggleSidebar() {
            sidebar.classList.toggle('hidden');
            overlay.classList.toggle('hidden');
        }

        menuBtn.addEventListener('click', toggleSidebar);
        closeBtn.addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', toggleSidebar);
    </script>
</body>
</html>
